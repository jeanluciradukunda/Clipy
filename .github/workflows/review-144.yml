name: Review 144 tests
on:
  push:
    branches: [review/pr144-tests]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
      - uses: actions/cache@v4
        with:
          path: Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: ${{ runner.os }}-pods-
      - run: gem install cocoapods && pod install
      - name: Test
        run: |
          set -o pipefail
          xcodebuild -workspace Clipy.xcworkspace -scheme Clipy -configuration Debug \
            -destination 'platform=macOS,arch=arm64' CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee test.log | grep -E "Test Case|error:|Executed|\*\* " || true
          grep -q "\*\* TEST SUCCEEDED \*\*" test.log
      - name: Exercise the CLI against the test app
        if: always()
        run: |
          CLI=$(find ~/Library/Developer/Xcode/DerivedData -path '*Debug/clipy' -type f | head -1)
          echo "cli: $CLI"; file "$CLI" || true
          "$CLI" --help; echo "help exit $?"
          "$CLI" status; echo "status exit $? (expect 4: app not running)"
          "$CLI" get; echo "get-no-arg exit $? (expect 64)"
          "$CLI" bogus; echo "bogus exit $? (expect 64)"
